<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Bağlantılı ToDo Uygulaması</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --danger: #EF4444;
            --danger-hover: #DC2626;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: var(--card-bg);
            transition: all 0.2s;
        }

        li.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .todo-text {
            font-size: 16px;
            word-break: break-word;
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger);
            padding: 8px;
            border-radius: 6px;
        }

        .delete-btn:hover {
            background-color: #FEE2E2;
            color: var(--danger-hover);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 15px;
        }

        .status-bar {
            margin-top: 20px;
            font-size: 12px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Görevlerim</h1>
        <form id="todo-form" class="input-group">
            <input type="text" id="todo-input" placeholder="Ne yapılması gerekiyor?" required autocomplete="off">
            <button type="submit">Ekle</button>
        </form>
        <ul id="todo-list">
            <!-- Todos will be injected here -->
        </ul>
        <div id="empty-state" class="empty-state" style="display: none;">
            Henüz görev yok. Yukarıdan ekleyin!
        </div>
        <div class="status-bar" id="status-bar">
            RDS Veritabanına bağlanılıyor...
        </div>
    </div>

    <script>
        const API_URL = '/api/todos';
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');
        const statusBar = document.getElementById('status-bar');

        async function fetchTodos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('API Hatası');
                const todos = await response.json();
                renderTodos(todos);
                statusBar.textContent = 'RDS Veritabanına bağlı ✅';
                statusBar.style.color = '#10B981';
            } catch (error) {
                console.error('Hata:', error);
                statusBar.textContent = 'Veritabanı bağlantısı koptu veya kurulamadı ❌';
                statusBar.style.color = 'var(--danger)';
            }
        }

        function renderTodos(todos) {
            todoList.innerHTML = '';
            if (todos.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                todos.forEach(todo => {
                    const li = document.createElement('li');
                    if (todo.completed) li.classList.add('completed');
                    
                    li.innerHTML = `
                        <div class="todo-left">
                            <input type="checkbox" \${todo.completed ? 'checked' : ''} onchange="toggleTodo(\${todo.id}, this.checked)">
                            <span class="todo-text">\${escapeHTML(todo.title)}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTodo(\${todo.id})">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }
        }

        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim();
            if (!title) return;

            todoInput.value = '';
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });
                if (response.ok) fetchTodos();
            } catch (error) {
                console.error('Görev eklenirken hata:', error);
            }
        });

        async function toggleTodo(id, completed) {
            try {
                await fetch(\`\${API_URL}/\${id}\`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: completed ? 1 : 0 })
                });
                fetchTodos();
            } catch (error) {
                console.error('Görev durumu güncellenirken hata:', error);
            }
        }

        async function deleteTodo(id) {
            try {
                await fetch(\`\${API_URL}/\${id}\`, {
                    method: 'DELETE'
                });
                fetchTodos();
            } catch (error) {
                console.error('Görev silinirken hata:', error);
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Başlangıçta görevleri çek
        fetchTodos();
    </script>
</body>
</html>
