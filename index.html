<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS 3-Tier ToDo App</title>
    <style>
        :root {
            --primary-color: #ff9900; /* AWS Orange */
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary-color);
        }
        .input-group {
            display: flex;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e68a00;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: #f9f9f9;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            border-left: 4px solid var(--primary-color);
        }
        .todo-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .completed {
            text-decoration: line-through;
            color: #888;
        }
        .delete-btn {
            background-color: #ff4d4d;
            border-radius: 4px;
            padding: 0.4rem 0.8rem;
        }
        .delete-btn:hover {
            background-color: #cc0000;
        }
        .status {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin-top: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AWS ToDo App</h1>
        <form id="todo-form" class="input-group">
            <input type="text" id="todo-input" placeholder="What needs to be done?" required>
            <button type="submit">Add</button>
        </form>
        <ul id="todo-list">
            <!-- Todos will be loaded here -->
        </ul>
        <div class="status" id="db-status">Connecting to Database...</div>
    </div>

    <script>
        const API_URL = '/api/todos';
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const dbStatus = document.getElementById('db-status');

        async function fetchTodos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const todos = await response.json();
                renderTodos(todos);
                dbStatus.textContent = '● Connected to MySQL Backend (RDS)';
                dbStatus.style.color = '#2e8b57';
            } catch (error) {
                console.error('Error fetching todos:', error);
                dbStatus.textContent = '● Database Connection Error';
                dbStatus.style.color = '#d9534f';
            }
        }

        function renderTodos(todos) {
            todoList.innerHTML = '';
            todos.forEach(todo => {
                const li = document.createElement('li');
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'todo-content';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.onchange = () => toggleTodo(todo.id, checkbox.checked);
                
                const span = document.createElement('span');
                span.textContent = todo.title;
                if (todo.completed) span.className = 'completed';

                contentDiv.appendChild(checkbox);
                contentDiv.appendChild(span);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '✕';
                deleteBtn.className = 'delete-btn';
                deleteBtn.onclick = () => deleteTodo(todo.id);
                
                li.appendChild(contentDiv);
                li.appendChild(deleteBtn);
                todoList.appendChild(li);
            });
        }

        todoForm.onsubmit = async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim();
            if (!title) return;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });
                if (response.ok) {
                    todoInput.value = '';
                    fetchTodos();
                }
            } catch (error) {
                console.error('Error adding todo:', error);
            }
        };

        async function toggleTodo(id, completed) {
            try {
                await fetch(`${API_URL}/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: completed ? 1 : 0 })
                });
                fetchTodos();
            } catch (error) {
                console.error('Error toggling todo:', error);
            }
        }

        async function deleteTodo(id) {
            try {
                await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });
                fetchTodos();
            } catch (error) {
                console.error('Error deleting todo:', error);
            }
        }

        // Initial load
        fetchTodos();
    </script>
</body>
</html>
